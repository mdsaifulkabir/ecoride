<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | EcoRide</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
    <a href="index.html" class="logo">Eco<span>Ride</span></a>
    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </nav>
</header>

<main class="auth-wrapper">
    <section class="auth-card">

        <h1>Welcome Back</h1>
        <p class="muted">Login to access your dashboard.</p>

        <div id="formMessage"></div>

        <form id="loginForm">

            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword"
                       minlength="6" required>
            </div>

            <div class="form-group">
                <label for="loginRole">Login As</label>

                <select id="loginRole" required>
                    <option value="">Select Role</option>
                    <option value="admin">Admin</option>
                    <option value="customer">Customer</option>
                    <option value="manager">Station Manager</option>
                    <option value="seller">Seller</option>
                </select>
            </div>

            <button type="submit">Login</button>

        </form>

        <p class="muted" style="margin-top:18px;">
            Don't have an account?
            <a href="register.html">Register here</a>
        </p>

        <p class="muted" style="margin-top:12px;font-size:13px;">
            Demo Admin: admin@ecoride.com / admin123
        </p>

    </section>
</main>

<footer class="footer">EcoRide</footer>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>

</body>
</html>
